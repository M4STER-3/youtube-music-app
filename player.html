<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YouTube Player Engine</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .message {
      box-sizing: border-box;
      display: flex;
      width: 100%;
      height: 100%;
      padding: 30px;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="player"></div>

  <script>
    "use strict";

    // Stable bridge contract used by the browser host today and by the Android WebView later.
    const BRIDGE_CHANNEL = "focus-hub-youtube";
    const PLAYER_API_VERSION = "1.0.0";
    const PROGRESS_INTERVAL_MS = 250;
    const PLAYLIST_RECOVERY_DELAY_MS = 900;
    const PLAYLIST_STALL_MS = 2600;

    const VIDEO_ID_PATTERN = /^[A-Za-z0-9_-]{11}$/;
    const PLAYLIST_ID_PATTERN = /^[A-Za-z0-9_-]{6,120}$/;
    const YT_STATE = Object.freeze({
      UNSTARTED: -1,
      ENDED: 0,
      PLAYING: 1,
      PAUSED: 2,
      BUFFERING: 3,
      CUED: 5,
    });

    const YT_STATE_NAMES = Object.freeze({
      [-1]: "unstarted",
      [0]: "ended",
      [1]: "playing",
      [2]: "paused",
      [3]: "buffering",
      [5]: "cued",
    });

    const params = new URLSearchParams(window.location.search);
    const initialRawPlaylistId = params.get("playlist") || "";
    const initialRawVideoId = params.get("video") || "";
    const initialPlaylistId = PLAYLIST_ID_PATTERN.test(initialRawPlaylistId) ? initialRawPlaylistId : "";
    const initialVideoId = VIDEO_ID_PATTERN.test(initialRawVideoId) ? initialRawVideoId : "";
    const initialPlaylistIndex = Math.max(0, Number.parseInt(params.get("index") || "0", 10) || 0);

    let player = null;
    let playerReady = false;
    let playerGeneration = 0;
    let mediaType = initialPlaylistId ? "playlist" : (initialVideoId ? "video" : "");
    let playlistId = initialPlaylistId;
    let videoId = initialVideoId;
    let playlistPosition = initialPlaylistIndex;
    let canonicalPlaylistIds = [];
    let playbackIntent = false;
    let loopEnabled = false;
    let shuffleEnabled = false;
    let presentationMode = params.get("presentation") === "background" ? "background" : "mini";
    let lastPlayerSize = "";
    let playerResizeFrame = 0;
    let lastVolumeSignature = "";
    let lastProgressSignature = "";
    let lastPublishedVideoId = "";
    let playlistEndedTimer = 0;
    let playlistStallSince = 0;
    let restoringPlayer = false;
    const pendingCommands = [];

    function stateName(state) {
      return YT_STATE_NAMES[Number(state)] || "unknown";
    }

    function clampNumber(value, minimum, maximum = Number.POSITIVE_INFINITY) {
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) return minimum;
      return Math.min(maximum, Math.max(minimum, parsed));
    }

    function normalizeVideoIds(ids) {
      if (!Array.isArray(ids)) return [];
      return [...new Set(ids
        .map((id) => String(id || ""))
        .filter((id) => VIDEO_ID_PATTERN.test(id)))]
        .slice(0, 5000);
    }

    function getCurrentVideoId() {
      const dataId = String(player?.getVideoData?.()?.video_id || "");
      if (VIDEO_ID_PATTERN.test(dataId)) return dataId;
      try {
        const playerUrl = new URL(String(player?.getVideoUrl?.() || ""));
        const urlId = String(playerUrl.searchParams.get("v") || "");
        return VIDEO_ID_PATTERN.test(urlId) ? urlId : "";
      } catch {
        return "";
      }
    }

    function getRuntimePlaylist() {
      const runtime = player?.getPlaylist?.();
      if (Array.isArray(runtime) && runtime.length) {
        return runtime.map((id) => String(id || "")).filter((id) => VIDEO_ID_PATTERN.test(id));
      }
      return [...canonicalPlaylistIds];
    }

    function getPlaylistIndex() {
      const reported = Number(player?.getPlaylistIndex?.());
      if (Number.isFinite(reported) && reported >= 0) {
        playlistPosition = Math.floor(reported);
        return playlistPosition;
      }
      const currentId = getCurrentVideoId();
      const runtime = getRuntimePlaylist();
      const found = currentId ? runtime.indexOf(currentId) : -1;
      if (found >= 0) playlistPosition = found;
      return Math.max(0, playlistPosition);
    }

    function getProgressSnapshot() {
      if (!playerReady || !player) {
        return {
          state: YT_STATE.UNSTARTED,
          stateName: "unstarted",
          currentVideoId: "",
          currentTime: 0,
          duration: 0,
          progress: 0,
          loadedFraction: 0,
        };
      }

      const state = Number(player.getPlayerState?.());
      const currentTime = Math.max(0, Number(player.getCurrentTime?.()) || 0);
      const duration = Math.max(0, Number(player.getDuration?.()) || 0);
      const loadedFraction = clampNumber(player.getVideoLoadedFraction?.(), 0, 1);
      return {
        state,
        stateName: stateName(state),
        currentVideoId: getCurrentVideoId(),
        currentTime,
        duration,
        progress: duration > 0 ? clampNumber(currentTime / duration, 0, 1) : 0,
        loadedFraction,
      };
    }

    function getPlayerSnapshot() {
      if (!playerReady || !player) {
        return {
          apiVersion: PLAYER_API_VERSION,
          ready: false,
          mediaType,
          playlistId,
          currentVideoId: "",
          currentTime: 0,
          duration: 0,
          progress: 0,
          loadedFraction: 0,
          loopEnabled,
          shuffleEnabled,
        };
      }

      const videoData = player.getVideoData?.() || {};
      const runtimePlaylist = getRuntimePlaylist();
      const progressData = getProgressSnapshot();
      return {
        apiVersion: PLAYER_API_VERSION,
        ready: true,
        mediaType,
        playlistId,
        state: progressData.state,
        stateName: progressData.stateName,
        shouldPlay: playbackIntent || [YT_STATE.PLAYING, YT_STATE.BUFFERING].includes(progressData.state),
        currentVideoId: progressData.currentVideoId,
        currentTime: progressData.currentTime,
        duration: progressData.duration,
        progress: progressData.progress,
        loadedFraction: progressData.loadedFraction,
        title: videoData.title || "",
        author: videoData.author || "",
        volume: clampNumber(player.getVolume?.(), 0, 100),
        muted: !!player.isMuted?.(),
        playlistIndex: getPlaylistIndex(),
        playlistLength: runtimePlaylist.length,
        playlist: runtimePlaylist,
        canonicalPlaylistLength: canonicalPlaylistIds.length,
        canonicalPlaylist: [...canonicalPlaylistIds],
        loopEnabled,
        shuffleEnabled,
      };
    }

    function buildBridgePayload(event, data = {}) {
      return {
        channel: BRIDGE_CHANNEL,
        kind: "event",
        event,
        apiVersion: PLAYER_API_VERSION,
        mediaType,
        videoId: getCurrentVideoId() || videoId,
        playlistId,
        timestamp: Date.now(),
        data,
      };
    }

    function postBridgeEvent(event, data = {}) {
      const payload = buildBridgePayload(event, data);

      // Direct same-page API for tests and WebView evaluateJavascript consumers.
      window.dispatchEvent(new CustomEvent("youtube-player-event", { detail: payload }));

      // Existing iframe/browser integration remains supported.
      if (window.parent !== window) {
        window.parent.postMessage(payload, "*");
      }
    }

    function publishState(event = "state") {
      postBridgeEvent(event, getPlayerSnapshot());
    }

    function publishProgress(force = false) {
      if (!playerReady || !player) return;
      const progress = getProgressSnapshot();
      const signature = [
        progress.state,
        progress.currentVideoId,
        progress.duration.toFixed(3),
        progress.currentTime.toFixed(2),
        progress.loadedFraction.toFixed(3),
      ].join("|");

      if (!force && signature === lastProgressSignature) return;
      lastProgressSignature = signature;
      postBridgeEvent("progress", progress);
    }

    function publishVideoChangedIfNeeded(force = false) {
      const currentId = getCurrentVideoId();
      if (!currentId) return;
      if (!force && currentId === lastPublishedVideoId) return;
      lastPublishedVideoId = currentId;
      videoId = currentId;
      publishState("videoChanged");
    }

    function setPlaybackIntent(shouldPlay) {
      playbackIntent = !!shouldPlay;
    }

    function clearPlaylistEndedRecovery() {
      window.clearTimeout(playlistEndedTimer);
      playlistEndedTimer = 0;
    }

    function applyPlaylistModes() {
      if (!playerReady || !player || mediaType !== "playlist") return;
      player.setLoop?.(loopEnabled);
      player.setShuffle?.(shuffleEnabled);
    }

    function seekToSeconds(seconds, allowSeekAhead = true) {
      if (!playerReady || !player) return false;
      const duration = Math.max(0, Number(player.getDuration?.()) || 0);
      const requested = Math.max(0, Number(seconds) || 0);
      const target = duration > 0 ? Math.min(requested, duration) : requested;
      player.seekTo?.(target, allowSeekAhead !== false);
      window.setTimeout(() => {
        publishProgress(true);
        publishState("seeked");
      }, 60);
      return true;
    }

    function seekBySeconds(offsetSeconds) {
      const current = Math.max(0, Number(player?.getCurrentTime?.()) || 0);
      return seekToSeconds(current + (Number(offsetSeconds) || 0), true);
    }

    function loadVideoMedia(value = {}) {
      const nextVideoId = String(value.videoId || "");
      if (!VIDEO_ID_PATTERN.test(nextVideoId)) {
        postBridgeEvent("error", { code: 2, message: "Identifiant vidéo YouTube invalide" });
        return false;
      }

      mediaType = "video";
      playlistId = "";
      canonicalPlaylistIds = [];
      playlistPosition = 0;
      videoId = nextVideoId;
      lastPublishedVideoId = "";
      const autoplay = value.autoplay !== false;
      const startSeconds = Math.max(0, Number(value.startSeconds) || 0);
      setPlaybackIntent(autoplay);

      const request = { videoId: nextVideoId, startSeconds };
      if (autoplay) player.loadVideoById?.(request);
      else player.cueVideoById?.(request);
      return true;
    }

    function loadPlaylistMedia(value = {}) {
      const nextPlaylistId = PLAYLIST_ID_PATTERN.test(String(value.playlistId || ""))
        ? String(value.playlistId)
        : "";
      const nextPlaylistIds = normalizeVideoIds(value.playlistIds);
      if (!nextPlaylistId && !nextPlaylistIds.length) {
        postBridgeEvent("error", { code: 2, message: "Playlist YouTube invalide ou vide" });
        return false;
      }

      mediaType = "playlist";
      playlistId = nextPlaylistId;
      canonicalPlaylistIds = nextPlaylistIds;
      playlistPosition = Math.max(0, Math.floor(Number(value.index) || 0));
      if (canonicalPlaylistIds.length) {
        playlistPosition = Math.min(playlistPosition, canonicalPlaylistIds.length - 1);
      }
      if (typeof value.loop === "boolean") loopEnabled = value.loop;
      if (typeof value.shuffle === "boolean") shuffleEnabled = value.shuffle;
      lastPublishedVideoId = "";

      const autoplay = value.autoplay !== false;
      const startSeconds = Math.max(0, Number(value.startSeconds) || 0);
      setPlaybackIntent(autoplay);

      if (canonicalPlaylistIds.length) {
        if (autoplay) player.loadPlaylist?.(canonicalPlaylistIds, playlistPosition, startSeconds);
        else player.cuePlaylist?.(canonicalPlaylistIds, playlistPosition, startSeconds);
      } else {
        const request = {
          listType: "playlist",
          list: playlistId,
          index: playlistPosition,
          startSeconds,
        };
        if (autoplay) player.loadPlaylist?.(request);
        else player.cuePlaylist?.(request);
      }

      window.setTimeout(applyPlaylistModes, 250);
      return true;
    }

    function loadMedia(value = {}) {
      clearPlaylistEndedRecovery();
      playlistStallSince = 0;
      if (value.type === "playlist") return loadPlaylistMedia(value);
      return loadVideoMedia(value);
    }

    function advancePlaylist(direction = 1, reason = "manual") {
      if (!playerReady || !player || mediaType !== "playlist") return false;
      clearPlaylistEndedRecovery();
      setPlaybackIntent(true);

      const runtime = getRuntimePlaylist();
      const currentIndex = getPlaylistIndex();
      if (runtime.length && !loopEnabled && !shuffleEnabled) {
        if (direction > 0 && currentIndex >= runtime.length - 1) {
          if (reason === "ended") {
            setPlaybackIntent(false);
            publishState("playlistEnded");
            return false;
          }
        }
        if (direction < 0 && currentIndex <= 0) {
          player.playVideoAt?.(0);
          return true;
        }
      }

      if (direction < 0) player.previousVideo?.();
      else player.nextVideo?.();
      return true;
    }

    function schedulePlaylistEndedRecovery(generation) {
      clearPlaylistEndedRecovery();
      if (mediaType !== "playlist" || !playbackIntent) return;
      const endedVideoId = getCurrentVideoId();
      const endedIndex = getPlaylistIndex();

      playlistEndedTimer = window.setTimeout(() => {
        playlistEndedTimer = 0;
        if (generation !== playerGeneration || !playerReady || !player || !playbackIntent) return;
        const state = Number(player.getPlayerState?.());
        const currentId = getCurrentVideoId();
        const currentIndex = getPlaylistIndex();
        if (state === YT_STATE.PLAYING || state === YT_STATE.BUFFERING) return;
        if ((endedVideoId && currentId && endedVideoId !== currentId) || endedIndex !== currentIndex) {
          player.playVideo?.();
          return;
        }
        advancePlaylist(1, "ended");
      }, PLAYLIST_RECOVERY_DELAY_MS);
    }

    function resizePlayer(requestedSize = null) {
      if (!playerReady || !player?.setSize) return false;
      const requestedWidth = Number(requestedSize?.width);
      const requestedHeight = Number(requestedSize?.height);
      const width = Math.max(1, Math.round(
        Number.isFinite(requestedWidth) && requestedWidth > 0
          ? requestedWidth
          : document.documentElement.clientWidth || window.innerWidth || 1
      ));
      const height = Math.max(1, Math.round(
        Number.isFinite(requestedHeight) && requestedHeight > 0
          ? requestedHeight
          : document.documentElement.clientHeight || window.innerHeight || 1
      ));
      const signature = `${width}x${height}`;
      if (signature === lastPlayerSize) return false;
      lastPlayerSize = signature;
      player.setSize(width, height);
      return true;
    }

    function schedulePlayerResize(requestedSize = null) {
      if (playerResizeFrame) cancelAnimationFrame(playerResizeFrame);
      playerResizeFrame = requestAnimationFrame(() => {
        playerResizeFrame = 0;
        resizePlayer(requestedSize);
      });
    }

    function restorePlayerSnapshot(snapshot) {
      if (!snapshot || !playerReady || !player) return;
      restoringPlayer = true;
      loopEnabled = !!snapshot.loopEnabled;
      shuffleEnabled = !!snapshot.shuffleEnabled;
      const shouldPlay = snapshot.shouldPlay === true;
      const currentTime = Math.max(0, Number(snapshot.currentTime) || 0);

      if (snapshot.mediaType === "playlist") {
        loadPlaylistMedia({
          playlistId: snapshot.playlistId,
          playlistIds: snapshot.canonicalPlaylist?.length ? snapshot.canonicalPlaylist : snapshot.playlist,
          index: Math.max(0, Number(snapshot.playlistIndex) || 0),
          startSeconds: currentTime,
          autoplay: shouldPlay,
          loop: loopEnabled,
          shuffle: shuffleEnabled,
        });
      } else if (VIDEO_ID_PATTERN.test(String(snapshot.currentVideoId || ""))) {
        loadVideoMedia({
          videoId: snapshot.currentVideoId,
          startSeconds: currentTime,
          autoplay: shouldPlay,
        });
      }

      player.setVolume?.(clampNumber(snapshot.volume, 0, 100));
      if (snapshot.muted) player.mute?.();
      else player.unMute?.();
      restoringPlayer = false;
    }

    function recreatePlayerForPresentation(nextMode) {
      const cleanMode = nextMode === "background" ? "background" : "mini";
      if (cleanMode === presentationMode) return;
      const snapshot = getPlayerSnapshot();
      presentationMode = cleanMode;
      clearPlaylistEndedRecovery();
      playerReady = false;
      const previous = player;
      player = null;
      ++playerGeneration;
      try {
        previous?.destroy?.();
      } catch {
        // A fresh YT.Player below replaces any stale iframe.
      }
      ensurePlayerTarget();
      createYoutubePlayer(snapshot);
    }

    function executeCommand(message = {}) {
      const command = String(message.command || "");
      const value = message.value;

      if (!playerReady || !player) {
        if (["getState", "getProgress"].includes(command)) return false;
        pendingCommands.push({ command, value });
        return false;
      }

      switch (command) {
        case "loadMedia":
          loadMedia(value || {});
          break;
        case "play":
          setPlaybackIntent(true);
          player.playVideo?.();
          break;
        case "pause":
          clearPlaylistEndedRecovery();
          setPlaybackIntent(false);
          player.pauseVideo?.();
          break;
        case "toggle":
          if (Number(player.getPlayerState?.()) === YT_STATE.PLAYING) {
            setPlaybackIntent(false);
            player.pauseVideo?.();
          } else {
            setPlaybackIntent(true);
            player.playVideo?.();
          }
          break;
        case "next":
          advancePlaylist(1, "manual");
          break;
        case "previous":
          advancePlaylist(-1, "manual");
          break;
        case "first":
          if (mediaType === "playlist") {
            setPlaybackIntent(true);
            playlistPosition = 0;
            player.playVideoAt?.(0);
          }
          break;
        case "restart":
          seekToSeconds(0, true);
          setPlaybackIntent(true);
          player.playVideo?.();
          break;
        case "seekTo":
          seekToSeconds(
            typeof value === "object" ? value?.seconds : value,
            typeof value === "object" ? value?.allowSeekAhead !== false : true
          );
          return true;
        case "seekBy":
          seekBySeconds(typeof value === "object" ? value?.seconds : value);
          return true;
        case "setVolume":
          player.setVolume?.(clampNumber(value, 0, 100));
          break;
        case "setMuted":
          if (value) player.mute?.();
          else player.unMute?.();
          break;
        case "setLoop":
          loopEnabled = !!value;
          if (mediaType === "playlist") applyPlaylistModes();
          break;
        case "setShuffle":
          shuffleEnabled = !!value;
          if (mediaType === "playlist") applyPlaylistModes();
          break;
        case "setPresentationMode":
          recreatePlayerForPresentation(value);
          return true;
        case "setViewportSize":
          schedulePlayerResize(value);
          return true;
        case "getState":
          publishState("snapshot");
          return true;
        case "getProgress":
          publishProgress(true);
          return true;
        case "recover":
          if (playbackIntent && !document.hidden) player.playVideo?.();
          window.setTimeout(() => publishState("snapshot"), 100);
          return true;
        default:
          return false;
      }

      window.setTimeout(() => publishState("snapshot"), 80);
      return true;
    }

    // Public direct API. Codex can call these methods from Android WebView.evaluateJavascript.
    window.YouTubePlayer = Object.freeze({
      version: PLAYER_API_VERSION,
      command(command, value = null) {
        return executeCommand({ command, value });
      },
      loadVideo(videoId, options = {}) {
        return executeCommand({
          command: "loadMedia",
          value: { type: "video", videoId, ...options },
        });
      },
      loadPlaylist(options = {}) {
        return executeCommand({
          command: "loadMedia",
          value: { type: "playlist", ...options },
        });
      },
      play() { return executeCommand({ command: "play" }); },
      pause() { return executeCommand({ command: "pause" }); },
      toggle() { return executeCommand({ command: "toggle" }); },
      next() { return executeCommand({ command: "next" }); },
      previous() { return executeCommand({ command: "previous" }); },
      first() { return executeCommand({ command: "first" }); },
      restart() { return executeCommand({ command: "restart" }); },
      seekTo(seconds, allowSeekAhead = true) {
        return executeCommand({ command: "seekTo", value: { seconds, allowSeekAhead } });
      },
      seekBy(seconds) { return executeCommand({ command: "seekBy", value: { seconds } }); },
      setVolume(volume) { return executeCommand({ command: "setVolume", value: volume }); },
      setMuted(muted) { return executeCommand({ command: "setMuted", value: !!muted }); },
      setLoop(enabled) { return executeCommand({ command: "setLoop", value: !!enabled }); },
      setShuffle(enabled) { return executeCommand({ command: "setShuffle", value: !!enabled }); },
      getState() { return getPlayerSnapshot(); },
      getProgress() { return getProgressSnapshot(); },
    });

    window.addEventListener("message", (event) => {
      const message = event.data;
      if (!message || message.channel !== BRIDGE_CHANNEL || message.kind !== "command") return;
      executeCommand(message);
    });

    function onPlayerReady(generation, restoreSnapshot = null) {
      if (generation !== playerGeneration) return;
      playerReady = true;
      const iframe = player.getIframe?.();
      if (iframe) {
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.setAttribute(
          "allow",
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        );
      }
      resizePlayer();

      if (restoreSnapshot) {
        restorePlayerSnapshot(restoreSnapshot);
      } else if (mediaType === "playlist" && playlistId) {
        loadPlaylistMedia({ playlistId, index: playlistPosition, autoplay: true });
      } else if (mediaType === "video" && videoId) {
        loadVideoMedia({ videoId, autoplay: true });
      }

      postBridgeEvent("ready", getPlayerSnapshot());
      while (pendingCommands.length) {
        const queued = pendingCommands.shift();
        executeCommand(queued);
      }
    }

    function onPlayerStateChange(event, generation) {
      if (generation !== playerGeneration) return;
      const state = Number(event.data);
      const semanticEvent = stateName(state);

      if (state === YT_STATE.PLAYING) {
        setPlaybackIntent(true);
        playlistStallSince = 0;
        clearPlaylistEndedRecovery();
        publishVideoChangedIfNeeded();
        if (mediaType === "playlist") applyPlaylistModes();
      } else if (state === YT_STATE.BUFFERING) {
        clearPlaylistEndedRecovery();
        publishVideoChangedIfNeeded();
      } else if (state === YT_STATE.PAUSED) {
        clearPlaylistEndedRecovery();
      } else if (state === YT_STATE.CUED) {
        publishVideoChangedIfNeeded();
        if (mediaType === "playlist") applyPlaylistModes();
      } else if (state === YT_STATE.ENDED) {
        publishProgress(true);
        if (mediaType === "video") {
          if (loopEnabled) {
            seekToSeconds(0, true);
            setPlaybackIntent(true);
            player.playVideo?.();
          } else {
            setPlaybackIntent(false);
          }
        } else if (mediaType === "playlist") {
          schedulePlaylistEndedRecovery(generation);
        }
      }

      publishState(semanticEvent);
      publishProgress(true);
    }

    function onPlayerError(event, generation) {
      if (generation !== playerGeneration) return;
      postBridgeEvent("error", {
        ...getPlayerSnapshot(),
        code: Number(event.data) || 0,
      });
    }

    function ensurePlayerTarget() {
      if (document.getElementById("player")) return;
      const target = document.createElement("div");
      target.id = "player";
      document.body.prepend(target);
    }

    function createYoutubePlayer(restoreSnapshot = null) {
      ensurePlayerTarget();
      const generation = ++playerGeneration;
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        playerVars: {
          playsinline: 1,
          rel: 0,
          controls: presentationMode === "background" ? 0 : 1,
          disablekb: presentationMode === "background" ? 1 : 0,
          enablejsapi: 1,
        },
        events: {
          onReady: () => onPlayerReady(generation, restoreSnapshot),
          onStateChange: (event) => onPlayerStateChange(event, generation),
          onError: (event) => onPlayerError(event, generation),
        },
      });
    }

    window.onYouTubeIframeAPIReady = function () {
      createYoutubePlayer();
    };

    window.addEventListener("resize", () => schedulePlayerResize());
    window.visualViewport?.addEventListener("resize", () => schedulePlayerResize());
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && playbackIntent && playerReady && player) {
        window.setTimeout(() => {
          const state = Number(player.getPlayerState?.());
          if (![YT_STATE.PLAYING, YT_STATE.BUFFERING].includes(state)) player.playVideo?.();
        }, 120);
      }
    });

    if (typeof ResizeObserver === "function") {
      const resizeObserver = new ResizeObserver(() => schedulePlayerResize());
      resizeObserver.observe(document.documentElement);
    }

    // Smooth progress stream for a YouTube-Music-style scrubber.
    window.setInterval(() => {
      if (!playerReady || !player) return;
      const state = Number(player.getPlayerState?.());
      if ([YT_STATE.PLAYING, YT_STATE.BUFFERING].includes(state)) {
        publishProgress();
        publishVideoChangedIfNeeded();
      }
    }, PROGRESS_INTERVAL_MS);

    // Low-frequency housekeeping: volume changes and playlist stall recovery.
    window.setInterval(() => {
      if (!playerReady || !player) return;

      const volumeSignature = `${player.getVolume?.()}-${!!player.isMuted?.()}`;
      if (volumeSignature !== lastVolumeSignature) {
        lastVolumeSignature = volumeSignature;
        publishState("volume");
      }

      if (mediaType !== "playlist" || !playbackIntent || document.hidden || restoringPlayer) {
        playlistStallSince = 0;
        return;
      }

      const state = Number(player.getPlayerState?.());
      if ([YT_STATE.PLAYING, YT_STATE.BUFFERING, YT_STATE.PAUSED].includes(state)) {
        playlistStallSince = 0;
        return;
      }

      if (![YT_STATE.ENDED, YT_STATE.UNSTARTED, YT_STATE.CUED].includes(state)) return;
      if (!playlistStallSince) playlistStallSince = Date.now();
      if (Date.now() - playlistStallSince >= PLAYLIST_STALL_MS) {
        advancePlaylist(1, "recovery");
        playlistStallSince = Date.now();
      }
    }, 500);

    // The engine is always initialized, even with no ?video= or ?playlist= query.
    // This is important for Android: the WebView can load player.html first and choose media later.
    const youtubeApiScript = document.createElement("script");
    youtubeApiScript.src = "https://www.youtube.com/iframe_api";
    youtubeApiScript.referrerPolicy = "strict-origin-when-cross-origin";
    youtubeApiScript.onerror = () => postBridgeEvent("error", {
      code: 5,
      message: "API YouTube inaccessible",
    });
    document.head.appendChild(youtubeApiScript);
  </script>
</body>
</html>
